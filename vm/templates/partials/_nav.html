<header class="nav">
  <div class="nav__inner">
    <div class="nav__left">
      <a href="{% url 'home' %}" class="nav__brand">ValleyMade</a>
      {% if user.is_authenticated %}
        <a href="{% url 'account' %}" class="nav__user-mobile">{{user.username}}</a>
      {% else %}
        <a href="{% url 'login' %}" class="nav__user-mobile">Kirish</a>
      {% endif %}
    </div>

    <ul class="nav__links">
      <li><a href="{% url 'shop' %}" {% if request.resolver_match.url_name == 'shop' %}class="is-active"{% endif %}>Do'kon</a></li>
      <li><a href="{% url 'about' %}" {% if request.resolver_match.url_name == 'about' %}class="is-active"{% endif %}>Haqimizda</a></li>
      <li><a href="{% url 'contact' %}" {% if request.resolver_match.url_name == 'contact' %}class="is-active"{% endif %}>Bog'lanish</a></li>
    </ul>

    <div class="nav__actions">
      {% if user.is_authenticated %}
        <a href="{% url 'account' %}" class="nav__account">{{user.username}}</a>
      {% else %}
        <a href="{% url 'login' %}" class="nav__account">Kirish</a>
      {% endif %}
      <a href="{% url 'cart' %}" class="nav__cart">
        Savat
        {% if cart_count and cart_count > 0 %}
          <span class="nav__cart-count">{{ cart_count }}</span>
        {% endif %}
      </a>
      <button class="nav__burger" data-burger aria-label="menu"><span></span></button>
    </div>
  </div>
</header>
