{% extends "base.html" %}
{% block title %}Bog'lanish — VM Graphics{% endblock %}

{% block content %}
<section class="section">
  <div class="wrap">
    <div class="split">
      <div>
<!--        <h1 class="ticker mt-16">  </h1>-->
        <div class="mt-32 stack" style="gap: 24px;">
          <div>
            <p class="eyebrow">Email</p>
            <a class="h-display h-sm mt-8" style="display:block" href="mailto:ValleyMade@gmail.com">ValleyMade@gmail.com</a>
          </div>
          <div>
            <p class="eyebrow">Telefon</p>
            <p class="h-display h-sm mt-8" style="display:block">+998 12 345 67 89</p>
          </div>
          <div>
            <p class="eyebrow">Telegram</p>
            <a class="h-display h-sm mt-8" style="display:block" href="https://t.me/ValleyMade">@ValleyMade</a>
          </div>
        </div>
      </div>

      <div>
        <form method="post" class="stack" data-validate style="gap: 16px;">
          {% csrf_token %}
          {% if form_errors %}<div class="msg msg--err">Xatoliklarni to'girlang!</div>{% endif %}

          <div class="field">
            <label for="id_name">Ism</label>
            <input class="input" id="id_name" name="name" required value="{{ form_data.name|default:'' }}">
          </div>
          <div class="field">
            <label for="id_email">Telefon</label>
            <input class="input" type="email" id="id_email" name="email" required value="{{ form_data.phone|default:'' }}">
          </div>
          <div class="field">
            <label for="id_subject">Mavzu</label>
            <input class="input" id="id_subject" name="subject" value="{{ form_data.subject|default:'' }}">
          </div>
          <div class="field">
            <label for="id_message">Habar</label>
            <textarea class="textarea" id="id_message" name="message" required>{{ form_data.message|default:'' }}</textarea>
          </div>

          <button class="btn btn--solid btn--block btn--lg" type="submit">Yuborish</button>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}
