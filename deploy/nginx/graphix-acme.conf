# GRAPHIX - the http-only site, used before the certificate exists.
#
# Copied to /etc/nginx/sites-available/graphix-acme.conf and symlinked into
# sites-enabled. It is removed the moment graphix.conf takes over.
#
# It exists because of an ordering problem. graphix.conf's two `443` blocks
# name certificate files, and nginx refuses to start when a named certificate
# is missing - so the real site cannot be enabled until certbot has issued
# one, and certbot cannot answer its own challenge until something is serving
# graphix.uz on port 80. This is that something.
#
# It also lets the site be tested through nginx, by Host header, before the
# domain points here at all:
#
#     curl -H 'Host: graphix.uz' http://57.128.240.51/uz/
#
# It deliberately does NOT redirect to https, which graphix.conf does: there is
# nothing to redirect to yet.

upstream graphix_acme {
    server unix:/run/graphix/graphix.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name graphix.uz www.graphix.uz;

    access_log /var/log/nginx/graphix.access.log;
    error_log  /var/log/nginx/graphix.error.log;

    client_max_body_size 20m;

    # certbot --webroot writes its challenge file here.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location /static/ {
        alias /srv/graphix/staticfiles/;
        access_log off;
    }
    location /media/ {
        alias /srv/graphix/media/;
        access_log off;
    }

    location / {
        proxy_pass http://graphix_acme;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Claim https so SECURE_SSL_REDIRECT does not bounce every request
        # while there is no https to bounce to. graphix.conf passes $scheme,
        # which is the honest value once TLS is real.
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
