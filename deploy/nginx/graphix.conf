# GRAPHIX — nginx, for the Ubuntu 24.04 VPS (plan §9 Phase 1b, §9 Phase 9 item 5).
#
# Not deployed from here: this is the file Phase 1b copies to
# /etc/nginx/sites-available/graphix.conf and symlinks into sites-enabled. It is
# in the repository so the server's behaviour is reviewable and so a rebuild
# does not start from a blog post.
#
# What this file is responsible for, and Django is not:
#
# * compression. Django serves neither static files nor media in production.
# * cache lifetimes. Hashed static names (ManifestStaticFilesStorage) can be
#   cached for a year because the name changes when the content does; media
#   files keep their names, so they get a month and a revalidation.
# * HTTP/2, so twenty card images are not twenty round trips in series.
# * the upload ceiling. A product photograph from a phone is several megabytes
#   and nginx's default limit is one.
#
# certbot writes the listen/ssl lines on first run; the two server blocks below
# are what it edits, not a second copy to keep in step.
#
# This machine already serves another site (§17 #241). Nothing here touches it:
# GRAPHIX has its own server_name, its own socket under its own /run directory,
# and its own log files, which /etc/logrotate.d/graphix rotates separately from
# the distribution's shared nginx logs.

upstream graphix {
    server unix:/run/graphix/graphix.sock fail_timeout=0;
}

# Everything on the bare domain and on http goes to https://graphix.uz.
server {
    listen 80;
    listen [::]:80;
    server_name graphix.uz www.graphix.uz;

    # certbot's own challenge has to answer over http.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://graphix.uz$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.graphix.uz;
    # ssl_certificate / ssl_certificate_key: written by certbot.
    return 301 https://graphix.uz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name graphix.uz;

    # ssl_certificate / ssl_certificate_key: written by certbot.

    # This site's own logs, so thirty-day rotation can be set for GRAPHIX
    # without touching the other site's (deploy/logrotate/graphix).
    access_log /var/log/nginx/graphix.access.log;
    error_log  /var/log/nginx/graphix.error.log;

    # A photograph from a phone. The panel refuses anything over 12 MB itself
    # (product/images.py MAX_BYTES); this is the outer bound, and it has to be
    # above it or nginx refuses the upload with a 413 the page cannot explain.
    client_max_body_size 20m;

    # HSTS, the frame and sniffing headers are set by Django when DEBUG is off
    # (vm/settings.py). They are NOT repeated here: two sources for one header
    # is how they end up disagreeing. The Content-Security-Policy is set by
    # Django too, and has to be: it carries a per-request nonce, which nginx
    # cannot mint (§17 #239).

    # ---------------------------------------------------------- compression
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/ld+json application/manifest+json
        image/svg+xml font/woff2;
    # Not image/webp, image/jpeg or image/png: they are already compressed and
    # gzipping them spends CPU to make them slightly larger.

    # Brotli, when the module is installed (`apt install libnginx-mod-brotli`
    # on 24.04). It is 15-20 % smaller than gzip on CSS and JS and costs
    # nothing at rest because the responses below are served from disk.
    # Uncomment with the module, not before: nginx will not start otherwise.
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css text/xml text/javascript
    #     application/javascript application/json application/xml
    #     application/ld+json application/manifest+json image/svg+xml font/woff2;

    # ------------------------------------------------------------- assets
    # Hashed names: the file at this URL can never change, so a year and
    # `immutable` are honest and a repeat visit costs no request at all.
    location /static/ {
        alias /srv/graphix/vm/staticfiles/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Media keeps its names — a photograph replaced in the admin is the same
    # URL with different bytes — so a month, revalidated. The WebP renditions
    # under /media/products/w/ are content-addressed by width rather than by
    # hash, which is why this is not `immutable` either.
    location /media/ {
        alias /srv/graphix/vm/media/;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # ---------------------------------------------------------------- app
    location / {
        proxy_pass http://graphix;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django reads this to know the request arrived over TLS
        # (SECURE_PROXY_SSL_HEADER). Without it SECURE_SSL_REDIRECT loops.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
