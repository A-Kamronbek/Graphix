<!doctype html>
<!--
  GRAPHIX share card - the picture Telegram, Instagram and search results show
  beside a link (static/img/og-image.png, 1200 x 630).

  The source of that PNG. Phase 1a set the card in a placeholder face before
  the brand had one (plan §18 #8); this sets it in the site's own - Playfair
  Display and Onest, the files the site serves - with the site's ground and
  ink, and the header's own lockup: the mark beside "GRAPHIX" in Playfair,
  spaced as `.nav__brand` spaces it. No accent: brass is spent only on price,
  the chosen size and the primary action (§17 #45).

  One picture for all three languages, so it carries the Uzbek line, and no
  figure that could go stale (no "100+ designs" - §17 #39 gates that claim).

  To regenerate, from the repository root in PowerShell, on one line (any
  Chromium browser takes the same switches; the paths must be absolute, and the
  time budget lets the two fonts load before the capture):

    & "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe" --headless
      --hide-scrollbars --window-size=1200,630 --virtual-time-budget=3000
      "--screenshot=$PWD\static\img\og-image.png" "$PWD\docs\brand\og-card.html"
-->
<html lang="uz">
<head>
<meta charset="utf-8">
<title>GRAPHIX share card</title>
<style>
  @font-face { font-family: "Playfair Display"; font-weight: 400 900;
    src: url("../../static/fonts/playfair-display-var.woff2") format("woff2-variations"); }
  @font-face { font-family: "Onest"; font-weight: 100 900;
    src: url("../../static/fonts/onest-var.woff2") format("woff2-variations"); }
  /* The site's tokens (static/css/tokens.css), copied because this page
     is rendered outside the site. */
  :root { --c-bg: #100E0C; --c-fg: #EFE9DE; --c-fg-muted: #B0A697; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden;
    background: var(--c-bg); color: var(--c-fg); }
  .card { box-sizing: border-box; width: 1200px; height: 630px;
    padding: 84px 96px 88px; display: flex; flex-direction: column;
    justify-content: space-between; }
  .card__brand { display: flex; align-items: center; gap: 16px; }
  .card__mark { width: 48px; height: 48px; fill: var(--c-fg); }
  .card__name { font-family: "Playfair Display", serif; font-weight: 700;
    font-size: 44px; letter-spacing: .10em; line-height: 1; }
  .card__line { margin: 0; font-family: "Playfair Display", serif; font-weight: 700;
    font-size: 76px; line-height: 1.06; letter-spacing: -0.015em; max-width: 900px;
    text-wrap: balance; }
  .card__sub { margin: 28px 0 0; font-family: "Onest", sans-serif; font-weight: 500;
    font-size: 30px; line-height: 1.3; color: var(--c-fg-muted); }
</style>
</head>
<body>
  <div class="card">
    <div class="card__brand">
      <!-- The mark's path, as in partials/_icons.svg.html (#i-mark). -->
      <svg class="card__mark" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2.3 10.75H21.7V13.25H2.3ZM5.26 2.83H8.15L18.74 21.17H15.85ZM15.85 2.83H18.74L8.15 21.17H5.26Z"/>
      </svg>
      <span class="card__name">GRAPHIX</span>
    </div>
    <div>
      <p class="card__line">Kiyishni istaydigan grafik futbolkalar</p>
      <p class="card__sub">Oʻzbekiston boʻylab yetkazib beriladi · graphix.uz</p>
    </div>
  </div>
</body>
</html>
