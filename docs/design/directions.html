<title>GRAPHIX Direction Review</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@600;700;800&family=Oswald:wght@500;600;700&display=swap">
<style>
  :root{
    --shell-bg:#efedea; --shell-panel:#f7f6f4; --shell-ink:#171614;
    --shell-mute:#6f6b64; --shell-line:#d6d2cb; --shell-inv-bg:#171614; --shell-inv-ink:#f7f6f4;
    --f-ui:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
    --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --shell-bg:#141312; --shell-panel:#1c1b19; --shell-ink:#f2f0ec;
      --shell-mute:#9b958c; --shell-line:#302e2b; --shell-inv-bg:#f2f0ec; --shell-inv-ink:#141312;
    }
  }
  :root[data-theme="dark"]{
    --shell-bg:#141312; --shell-panel:#1c1b19; --shell-ink:#f2f0ec;
    --shell-mute:#9b958c; --shell-line:#302e2b; --shell-inv-bg:#f2f0ec; --shell-inv-ink:#141312;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--shell-bg);color:var(--shell-ink);font-family:var(--f-ui);
       -webkit-font-smoothing:antialiased}

  .bar{position:sticky;top:0;z-index:10;background:var(--shell-bg);
       border-bottom:1px solid var(--shell-line);padding:14px clamp(16px,4vw,32px);
       display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center}
  .bar__id{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
           color:var(--shell-mute);margin-right:auto}
  .bar__id b{color:var(--shell-ink);font-weight:500}
  .seg{display:flex;border:1px solid var(--shell-line);border-radius:2px;overflow:hidden}
  .seg button{appearance:none;border:0;background:transparent;color:var(--shell-mute);
      font-family:var(--f-ui);font-size:13px;font-weight:600;padding:8px 14px;cursor:pointer;
      border-right:1px solid var(--shell-line);white-space:nowrap}
  .seg button:last-child{border-right:0}
  .seg button[aria-pressed="true"]{background:var(--shell-inv-bg);color:var(--shell-inv-ink)}
  .seg button:focus-visible{outline:2px solid var(--shell-ink);outline-offset:-2px}

  .stage{padding:clamp(18px,4vw,38px) clamp(12px,4vw,32px) 8px;display:flex;justify-content:center}
  .device{background:var(--shell-panel);border:1px solid var(--shell-line);border-radius:3px;
          width:100%;max-width:1440px;transition:max-width .25s ease}
  .device[data-w="390"]{max-width:390px}
  .device iframe{display:block;width:100%;height:min(78vh,940px);border:0;background:#fff}

  .notes{max-width:1000px;margin:0 auto;padding:8px clamp(16px,4vw,32px) 64px}
  .notes h2{font-family:var(--f-ui);font-size:clamp(20px,3vw,26px);font-weight:800;
            letter-spacing:-.015em;margin:26px 0 6px;text-wrap:balance}
  .notes .lede{color:var(--shell-mute);font-size:15px;line-height:1.6;margin:0 0 18px;max-width:62ch}
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;
         background:var(--shell-line);border:1px solid var(--shell-line);margin-bottom:22px}
  .facts div{background:var(--shell-bg);padding:12px 14px}
  .facts dt{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
            color:var(--shell-mute);margin:0 0 5px}
  .facts dd{margin:0;font-size:14px;line-height:1.45}
  .risk{border-left:2px solid var(--shell-ink);padding:2px 0 2px 14px;margin:0 0 10px;
        font-size:14px;line-height:1.6;max-width:62ch}
  .risk b{font-weight:700}
  .foot{border-top:1px solid var(--shell-line);margin-top:34px;padding-top:16px;
        font-family:var(--f-mono);font-size:11px;line-height:1.8;color:var(--shell-mute);
        letter-spacing:.03em}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  </div>
</div>

/* ---------- one semantic skeleton, three treatments ------------------------ */
function body(){
  return `
<header class="nav">
  <a class="nav__brand" href="#">${mark(18)}<span>GRAPHIX</span></a>
  <nav class="nav__links"><a href="#">Doʻkon</a><a href="#">Haqimizda</a><a href="#">Bogʻlanish</a></nav>
  <div class="nav__act"><a href="#">Qidiruv</a><a href="#">Savat <i>2</i></a></div>
</header>

<main class="pdp">
  <section class="gal">
    <div class="gal__main"><img src="${IMG[P.gallery[0]]}" alt="${P.name} — old tomoni"></div>
    <ul class="gal__thumbs">
      ${P.gallery.map((k,i)=>`<li${i===0?' class="is-on"':''}><img src="${IMG[k]}" alt=""></li>`).join("")}
    </ul>
  </section>

  <section class="buy">
    <p class="crumb"><a href="#">Doʻkon</a> <span>/</span> Futbolka</p>
    <h1 class="title">${P.name}</h1>
    <p class="price"><span>${P.price}</span> <em>${P.cur}</em></p>

    <div class="row-lab">
      <span class="lab">Oʻlcham</span>
      <a class="guide" href="#">Oʻlcham jadvali</a>
    </div>
    <ul class="sizes">
      ${P.sizes.map(([s,ok],i)=>`<li><button type="button" ${ok?"":"disabled"} ${i===1?'aria-pressed="true"':'aria-pressed="false"'}>${s}${ok?"":"<i>tugadi</i>"}</button></li>`).join("")}
    </ul>

    <div class="cta">
      <button class="add" type="button">Savatga qoʻshish</button>
      <button class="ico" type="button" aria-label="Saqlash">${heart()}</button>
      <button class="ico" type="button" aria-label="Ulashish">${share()}</button>
    </div>

    <dl class="spec">
      ${P.specs.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}
    </dl>

    <dl class="ship">
      <p class="lab">Yetkazib berish</p>
      ${P.delivery.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}
      <p class="ship__note">Butun Oʻzbekiston boʻylab — Oʻzbekiston pochtasi orqali.</p>
    </dl>

    <p class="desc">${P.desc}</p>
  </section>
</main>

<section class="rel">
  <h2>Oʻxshash dizaynlar</h2>

      <p class="rel__p">${money(c.price)} soʻm</p>

</section>

<div class="sticky">
  <div><b>${P.price} ${P.cur}</b><span>Oʻlcham: M</span></div>
  <button type="button">Savatga qoʻshish</button>
</div>`;
}

function share(){return `<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 15V3m0 0L8 7m4-4 4 4M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>`}

/* ---------- base structure shared by every direction ---------------------- */
const BASE = `
*{box-sizing:border-box}

/* ---------- wiring --------------------------------------------------------- */
let dir = "a", vw = "390";
const frame = document.querySelector("iframe");
const device = document.querySelector(".device");
const notes = document.getElementById("notes");

function render(){
  frame.srcdoc = `<!doctype html><html lang="uz"><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@600;700;800&family=Oswald:wght@500;600;700&display=swap">
    <style>${CSS[dir]}</style></head><body>${body()}</body></html>`;
  const n = NOTES[dir];
  notes.innerHTML = `<h2>${n.h}</h2><p class="lede">${n.lede}</p>
    <dl class="facts">${n.facts.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>
    <p class="risk">${n.risk}</p>
    <p class="foot">Garments are drawn mockups, not photographs — real product shots replace them
      before launch (plan §8).<br>Every typeface here contains U+02BB, so Oʻzbekiston and boʻylab
      set correctly. Poppins, Manrope, Figtree, Outfit and 18 others cannot.</p>`;
}

document.querySelectorAll("[data-dir]").forEach(b=>b.addEventListener("click",()=>{
  dir=b.dataset.dir;
  document.querySelectorAll("[data-dir]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  render();
}));
document.querySelectorAll(".bar [data-w]").forEach(b=>b.addEventListener("click",()=>{
  vw=b.dataset.w;
  document.querySelectorAll(".bar [data-w]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  device.dataset.w = vw;
}));
render();
</script>
